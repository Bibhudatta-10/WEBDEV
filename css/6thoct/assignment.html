<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout design</title>

    <style>
        .main{
            border: 1px solid black;
            height: 97vh;
        }

        .head{
            display: flex;
            border: 1px solid black;
        }

        .head_child1{
            border: 1px solid black;
            display: flex;
            flex: 1;
        }

        .head_child2{
            display: flex;
            flex: 1;
        }

        .head_child3{
            border: 1px solid black;
            display: flex;
            flex: 1;
        }

        .nav{

            border: 1px solid black;
            display: flex;

        }

        .nav1{
            border: 1px solid black;
            display: flex;
            flex: 2;
        }

        .nav2{
            border: 1px solid black;
            display: flex;
            flex: 1;
        }

        .nav3{
            border: 1px solid black;
            display: flex;
            flex: 2;
        }

        .body{
            margin-top: 2%;
            border: 1px solid black;
            height: 70vh;
        }

        .button{
            display: flex;
        }

        .button1{
            border: 1px solid black;
            position: relative;
            top: 400px;
            left: 70px;
        }

        .button2{
            border: 1px solid black;
            position: relative;
            top: 400px;
            left: 100px;
        }

        .footer{
            display: flex;
            gap: 2%;
        }

        .card1{
            border: 1px solid black;
            display: flex;
            gap: 1%;
        }

        .card2{
            border: 1px solid black;
            display: flex;
            gap: 1%;
        }

        .card3{
            border: 1px solid black;
            display: flex;
            gap: 1%;
        }

        .image{
            border: 1px solid black;
        }

        .text{
            border: 1px solid black;
        }

    </style>
</head>
<body>
    <div class="main">

        <div class="head">

            <div class="head_child1">head child 1</div>
            <div class="head_child2"></div>
            <div class="head_child3">head child 3</div>

        </div>

        <div class="body">

            <div class="nav">
                <div class="nav1">nav1</div>
                <div class="nav2">nav2</div>
                <div class="nav3">nav3</div>
            </div>

            <div class="button">
                <div class="button1">button 1</div>
                <div class="button2">button 2</div>
            </div>

        </div>

        <div class="footer">

            <div class="card1">
                <div class="image">image</div>
                <div class="text">text</div>
            </div>

            <div class="card2">
                <div class="image">image</div>
                <div class="text">text</div>
            </div>

            <div class="card3">
                <div class="image">image</div>
                <div class="text">text</div>
            </div>

        </div>

    </div>
</body>
</html>
